name: ci

on:
  push:
    branches: [main, "phase-*"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Require committed lockfile
        run: test -f package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Controlled-launch static gate
        run: npm run release:check
        env:
          NEXT_PUBLIC_APP_URL: https://preview.invalid
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: test
          SUPABASE_SECRET_KEY: test
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
          TURNSTILE_SECRET_KEY: test
          RATE_LIMIT_HASH_SALT: test-test-test-test-test-test
          CRON_SECRET: test-test-test-test-test-test
          STRIPE_PRICE_STARTER: price_test
          STRIPE_PRICE_PLUS: price_test
          STRIPE_PRICE_PRO: price_test

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Require committed lockfile
        run: test -f package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Preview readiness from external runner
        run: |
          curl --fail --silent --show-error --location \
            --max-redirs 0 \
            https://provenance-cleaner-git-control-32678d-rrahul0904-5013s-projects.vercel.app/api/readiness \
            | tee /tmp/readiness.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/readiness.json","utf8")); if(x.status!=="ready"||x.missing?.length) process.exit(1)'
