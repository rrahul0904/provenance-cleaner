name: preview-live-smoke

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: preview-live-smoke-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  exact-preview:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Refuse a different SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.event.deployment.sha }}"
      - name: Validate Vercel Preview target
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
        run: |
          case "$PREVIEW_URL" in
            https://*.vercel.app*) ;;
            *) echo "::error::Deployment target is not a Vercel Preview URL: $PREVIEW_URL"; exit 1 ;;
          esac
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Prove exact-head Preview guest, billing, Stripe TEST and transform flows
        env:
          PREVIEW_URL: ${{ github.event.deployment_status.target_url }}
          EXPECTED_HEAD_SHA: ${{ github.event.deployment.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test tests/preview-live/guest-session.preview.spec.ts tests/preview-live/controlled-launch.spec.ts --config=playwright.preview.config.ts
      - name: Preserve Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-live-smoke-${{ github.event.deployment.sha }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
