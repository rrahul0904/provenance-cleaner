name: preview-live-smoke

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read

jobs:
  guest-session-preview:
    if: github.event.pull_request.number == 13 && github.event.pull_request.head.ref == 'final-parity-audit-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Prove real Preview guest-session persistence
        env:
          PREVIEW_URL: https://provenance-cleaner-git-final-p-af6480-rrahul0904-5013s-projects.vercel.app
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx playwright test tests/preview-live/guest-session.preview.spec.ts --config=playwright.preview.config.ts
      - name: Preserve Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-guest-session-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
